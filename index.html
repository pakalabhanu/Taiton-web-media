<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taiton web@Media — AI Camera & Prompt Studio</title>
  <style>
    :root {
      --bg-primary: #090b10;
      --bg-secondary: #111520;
      --bg-card: #151a27;
      --bg-card-hover: #1b2233;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --badge-bg: rgba(99, 102, 241, 0.14);
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Blended Welcome Intro Overlay (Plays strictly on page load/refresh, zero text/buttons, full screen blend) */
    #welcomeOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      mix-blend-mode: screen;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #welcomeOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #welcomeVideo {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 720px;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: contrast(1.35) brightness(1.08);
      -webkit-mask-image: radial-gradient(ellipse 78% 78% at 50% 50%, #000 55%, transparent 96%);
      mask-image: radial-gradient(ellipse 78% 78% at 50% 50%, #000 55%, transparent 96%);
      pointer-events: none;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 16, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 32px;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand h1 span {
      color: #818cf8;
    }

    .model-badges {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--badge-bg);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .brand p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 560px;
      justify-content: flex-end;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 340px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Filter Bar */
    .filter-bar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 32px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .category-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .pill:hover {
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .pill .count {
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    /* Grid */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 32px 60px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--border-accent);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      background: var(--bg-card-hover);
    }

    /* Animated Viewfinder Canvas */
    .viewport {
      position: relative;
      height: 196px;
      background: radial-gradient(circle at 50% 45%, #182038 0%, #0b0e17 100%);
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
      cursor: pointer;
    }

    .grid-floor {
      position: absolute;
      inset: -40%;
      background-image:
        linear-gradient(to right, rgba(99, 102, 241, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(99, 102, 241, 0.14) 1px, transparent 1px);
      background-size: 32px 32px;
      transform-origin: center center;
    }

    .scene-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    .pillar {
      position: absolute;
      width: 22px;
      height: 86px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(148, 163, 184, 0.22), rgba(148, 163, 184, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pillar.left { left: 26%; }
    .pillar.right { right: 26%; }

    .subject-prism {
      position: relative;
      width: 44px;
      height: 58px;
      background: linear-gradient(145deg, #818cf8, #4f46e5);
      clip-path: polygon(50% 0%, 100% 28%, 100% 72%, 50% 100%, 0% 72%, 0% 28%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px rgba(99, 102, 241, 0.5);
    }

    .subject-prism::after {
      content: '';
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
    }

    /* HUD Overlays */
    .hud-tag {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      padding: 4px 8px;
      border-radius: 5px;
      background: rgba(9, 11, 16, 0.78);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 2;
    }

    .hud-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: rgba(255, 255, 255, 0.32);
      border-style: solid;
      z-index: 2;
    }

    .hud-tl { top: 10px; left: 10px; border-width: 1.5px 0 0 1.5px; }
    .hud-tr { top: 10px; right: 10px; border-width: 1.5px 1.5px 0 0; }
    .hud-br { bottom: 10px; right: 10px; border-width: 0 1.5px 1.5px 0; }

    /* Camera Motion Animations */
    .anim-dolly-in .scene-stage { animation: dollyIn 4s ease-in-out infinite alternate; }
    .anim-dolly-in .grid-floor { animation: gridDollyIn 4s ease-in-out infinite alternate; }
    @keyframes dollyIn {
      0% { transform: scale(0.82); }
      100% { transform: scale(1.38); }
    }
    @keyframes gridDollyIn {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.55); }
    }

    .anim-dolly-out .scene-stage { animation: dollyOut 4s ease-in-out infinite alternate; }
    @keyframes dollyOut {
      0% { transform: scale(1.42); }
      100% { transform: scale(0.76); }
    }

    .anim-orbit .scene-stage { animation: orbitMove 4.5s ease-in-out infinite alternate; }
    .anim-orbit .pillar.left { animation: orbitPillarL 4.5s ease-in-out infinite alternate; }
    .anim-orbit .pillar.right { animation: orbitPillarR 4.5s ease-in-out infinite alternate; }
    @keyframes orbitMove {
      0% { transform: translateX(-22px) rotateY(-18deg); }
      100% { transform: translateX(22px) rotateY(18deg); }
    }
    @keyframes orbitPillarL {
      0% { transform: translateX(-28px) scale(0.85); }
      100% { transform: translateX(48px) scale(1.15); }
    }
    @keyframes orbitPillarR {
      0% { transform: translateX(-48px) scale(1.15); }
      100% { transform: translateX(28px) scale(0.85); }
    }

    .anim-truck .scene-stage { animation: truckSlide 3.8s ease-in-out infinite alternate; }
    @keyframes truckSlide {
      0% { transform: translateX(-52px); }
      100% { transform: translateX(52px); }
    }

    .anim-pedestal .scene-stage { animation: pedestalLift 3.8s ease-in-out infinite alternate; }
    @keyframes pedestalLift {
      0% { transform: translateY(34px); }
      100% { transform: translateY(-34px); }
    }

    .anim-steadicam .scene-stage { animation: steadicamFloat 3.6s ease-in-out infinite alternate; }
    @keyframes steadicamFloat {
      0% { transform: scale(0.92) translate(-10px, 6px) rotate(-1.5deg); }
      50% { transform: scale(1.06) translate(4px, -5px) rotate(1deg); }
      100% { transform: scale(1.18) translate(12px, 4px) rotate(-1deg); }
    }

    .anim-pan .scene-stage { animation: panSweep 4.2s ease-in-out infinite alternate; }
    @keyframes panSweep {
      0% { transform: translateX(-65px) skewY(2deg); }
      100% { transform: translateX(65px) skewY(-2deg); }
    }

    .anim-tilt .scene-stage { animation: tiltSweep 4s ease-in-out infinite alternate; }
    @keyframes tiltSweep {
      0% { transform: translateY(44px) scale(0.95); }
      100% { transform: translateY(-44px) scale(1.05); }
    }

    .anim-whip .scene-stage { animation: whipPan 2.6s cubic-bezier(0.85, 0, 0.15, 1) infinite alternate; }
    @keyframes whipPan {
      0%, 20% { transform: translateX(-75px); filter: blur(0px); }
      50% { transform: translateX(0px) scaleX(1.35); filter: blur(4px); }
      80%, 100% { transform: translateX(75px); filter: blur(0px); }
    }

    .anim-dutch .scene-stage { animation: dutchRoll 4s ease-in-out infinite alternate; }
    @keyframes dutchRoll {
      0% { transform: rotate(-16deg) scale(1.08); }
      100% { transform: rotate(16deg) scale(1.08); }
    }

    .anim-crash .scene-stage { animation: crashZoom 2.4s cubic-bezier(0.7, 0, 0.2, 1) infinite; }
    @keyframes crashZoom {
      0%, 25% { transform: scale(0.8); }
      45%, 80% { transform: scale(1.75); }
      100% { transform: scale(0.8); }
    }

    .anim-vertigo .subject-prism { animation: vertigoSubject 3.8s ease-in-out infinite alternate; }
    .anim-vertigo .grid-floor { animation: vertigoBg 3.8s ease-in-out infinite alternate; }
    @keyframes vertigoSubject {
      0% { transform: scale(1); }
      100% { transform: scale(1.02); }
    }
    @keyframes vertigoBg {
      0% { transform: scale(0.75); }
      100% { transform: scale(1.85); }
    }

    .anim-rack .subject-prism { animation: rackFront 3.6s ease-in-out infinite alternate; }
    .anim-rack .pillar { animation: rackBack 3.6s ease-in-out infinite alternate; }
    @keyframes rackFront {
      0%, 30% { filter: blur(0px); transform: scale(1.06); }
      70%, 100% { filter: blur(5px); transform: scale(0.96); }
    }
    @keyframes rackBack {
      0%, 30% { filter: blur(5px); opacity: 0.45; }
      70%, 100% { filter: blur(0px); opacity: 1; }
    }

    .anim-macro .scene-stage { animation: macroCreep 4.5s ease-in-out infinite alternate; }
    @keyframes macroCreep {
      0% { transform: scale(1.25); }
      100% { transform: scale(2.15); }
    }

    .anim-fpv .scene-stage { animation: fpvDive 3.4s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes fpvDive {
      0% { transform: translateY(-48px) scale(0.65) rotate(-18deg); }
      55% { transform: translateY(12px) scale(1.35) rotate(12deg); }
      100% { transform: translateY(-48px) scale(0.65) rotate(-18deg); }
    }

    .anim-crane .scene-stage { animation: craneRise 4.2s ease-in-out infinite alternate; }
    @keyframes craneRise {
      0% { transform: translateY(32px) scale(1.22); }
      100% { transform: translateY(-38px) scale(0.74); }
    }

    .anim-topdown .scene-stage { animation: topDownSpin 6s linear infinite; }
    @keyframes topDownSpin {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    .anim-handheld .scene-stage { animation: handheldShake 1.8s ease-in-out infinite alternate; }
    @keyframes handheldShake {
      0% { transform: translate(-4px, 3px) rotate(-1.2deg); }
      33% { transform: translate(5px, -4px) rotate(1.4deg); }
      66% { transform: translate(-3px, -2px) rotate(-0.8deg); }
      100% { transform: translate(4px, 4px) rotate(1.1deg); }
    }

    .card:hover .scene-stage,
    .card:hover .grid-floor,
    .card:hover .pillar,
    .card:hover .subject-prism {
      animation-duration: 1.8s !important;
    }

    /* Card Content */
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .best-for {
      font-size: 0.78rem;
      font-weight: 600;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      flex: 1;
    }

    .prompt-box {
      background: rgba(9, 11, 16, 0.72);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 14px;
    }

    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .prompt-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .edit-params-btn {
      background: none;
      border: none;
      color: #818cf8;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }

    .edit-params-btn:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }

    .prompt-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      color: #e2e8f0;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .copy-btn {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .copy-btn.copied {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 560px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .close-modal {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .close-modal:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text-primary);
      font-size: 0.86rem;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .live-output-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-md);
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: #e2e8f0;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (max-width: 640px) {
      header, .filter-bar, main { padding-left: 16px; padding-right: 16px; }
      .cards-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Blended Welcome Intro (Plays ONLY on page load / refresh, zero text/buttons) -->
  <div id="welcomeOverlay" onclick="dismissWelcome()">
    <video id="welcomeVideo" autoplay muted playsinline>
      <source src="Welcom-Note.mp4" type="video/mp4" />
      <source src="welcome.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Top Header -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </div>
        <div>
          <div class="brand-title-row">
            <h1>Taiton <span>web@Media</span></h1>
            <span class="model-badges">VEO / KLING / SORA / FLOW</span>
          </div>
          <p>Interactive Cinema Motion Library &amp; AI Prompt Studio</p>
        </div>
      </div>

      <div class="header-controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search movements, lenses, prompts..." />
        </div>
        <button class="btn-primary" id="openCreateModalBtn">+ Add New Movement</button>
      </div>
    </div>
  </header>

  <!-- Category Filters -->
  <div class="filter-bar">
    <div class="category-pills" id="categoryPills"></div>
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span>Live Motion Previews Active</span>
    </div>
  </div>

  <!-- Movement Cards Grid -->
  <main>
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <footer>
    &copy; 2026 Taiton web@Media &mdash; AI Camera Movement &amp; Prompt Engineering Studio
  </footer>

  <!-- Prompt Customizer Modal -->
  <div class="modal-backdrop" id="customizerModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalMovementTitle">Customize Prompt Parameters</h2>
        <button class="close-modal" onclick="closeModal('customizerModal')">&times;</button>
      </div>
      <div class="form-grid">
        <div class="form-group full">
          <label>Subject / Scene Description</label>
          <input type="text" id="paramSubject" value="[SUBJECT]" placeholder="e.g., brushed aluminum door handle in luxury interior" />
        </div>
        <div class="form-group">
          <label>Lens Focal Length</label>
          <select id="paramLens">
            <option value="14mm ultra-wide lens">14mm Ultra-Wide</option>
            <option value="24mm wide-angle cinema lens">24mm Wide Cinema</option>
            <option value="35mm anamorphic prime lens" selected>35mm Anamorphic Prime</option>
            <option value="50mm standard prime lens">50mm Standard Prime</option>
            <option value="85mm portrait telephoto lens">85mm Telephoto</option>
            <option value="100mm macro cinema lens">100mm Macro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Camera Motion Speed</label>
          <select id="paramSpeed">
            <option value="ultra-slow, hypnotic">Ultra-Slow / Hypnotic</option>
            <option value="smooth, controlled" selected>Smooth / Controlled</option>
            <option value="brisk, energetic">Brisk / Energetic</option>
            <option value="high-speed, explosive">High-Speed / Explosive</option>
          </select>
        </div>
        <div class="form-group">
          <label>Aspect Ratio</label>
          <select id="paramAspect">
            <option value="--ar 16:9" selected>16:9 Widescreen</option>
            <option value="--ar 9:16">9:16 Vertical Reels/Shorts</option>
            <option value="--ar 2.39:1">2.39:1 Anamorphic Scope</option>
            <option value="--ar 1:1">1:1 Square</option>
          </select>
        </div>
        <div class="form-group">
          <label>Lighting &amp; Render Quality</label>
          <select id="paramQuality">
            <option value="volumetric studio lighting, photorealistic 8K 60fps" selected>Studio Volumetric 8K</option>
            <option value="golden hour natural sunlight, shallow depth of field">Golden Hour Natural</option>
            <option value="moody cyberpunk neon reflections, dramatic contrast">Moody Neon Contrast</option>
          </select>
        </div>
      </div>
      <div class="live-output-box" id="livePromptPreview"></div>
      <button class="btn-primary" style="width: 100%; justify-content: center;" id="modalCopyBtn">Copy Customized Prompt</button>
    </div>
  </div>

  <!-- Add New Movement Modal -->
  <div class="modal-backdrop" id="createModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Add Custom Camera Movement</h2>
        <button class="close-modal" onclick="closeModal('createModal')">&times;</button>
      </div>
      <form id="createMovementForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Movement Name</label>
            <input type="text" id="newTitle" required placeholder="e.g., Low-Angle Hero Push" />
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="newCategory">
              <option value="Dolly & Tracking">Dolly &amp; Tracking</option>
              <option value="Pan & Tilt">Pan &amp; Tilt</option>
              <option value="Zoom & Lens">Zoom &amp; Lens</option>
              <option value="Drone & Aerial">Drone &amp; Aerial</option>
              <option value="Dynamic / Action">Dynamic / Action</option>
            </select>
          </div>
          <div class="form-group">
            <label>Preview Animation Style</label>
            <select id="newAnim">
              <option value="anim-dolly-in">Dolly Push-In</option>
              <option value="anim-orbit">360° Orbital Arc</option>
              <option value="anim-truck">Lateral Truck Slide</option>
              <option value="anim-pan">Horizontal Pan</option>
              <option value="anim-crash">Crash Zoom</option>
              <option value="anim-fpv">FPV Aerial Dive</option>
            </select>
          </div>
          <div class="form-group">
            <label>Best Used For</label>
            <input type="text" id="newBestFor" required placeholder="e.g., Product Reveal & Architecture" />
          </div>
          <div class="form-group full">
            <label>Description</label>
            <input type="text" id="newDesc" required placeholder="Short explanation of the camera physics..." />
          </div>
          <div class="form-group full">
            <label>AI Prompt Template (use [SUBJECT] placeholder)</label>
            <textarea id="newPrompt" rows="3" required placeholder="Cinematic low-angle dolly push-in toward [SUBJECT]..."></textarea>
          </div>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Save Movement Preset</button>
      </form>
    </div>
  </div>

  <script>
    // Welcome Video Overlay Logic: plays strictly on page load/refresh, click dismisses immediately
    const welcomeOverlay = document.getElementById('welcomeOverlay');
    const welcomeVideo = document.getElementById('welcomeVideo');

    function dismissWelcome() {
      if (!welcomeOverlay || welcomeOverlay.classList.contains('hidden')) return;
      welcomeOverlay.classList.add('hidden');
      if (welcomeVideo) {
        welcomeVideo.pause();
      }
    }

    if (welcomeVideo) {
      welcomeVideo.addEventListener('ended', dismissWelcome);

      // Silently dismiss if video file is missing or cannot load
      const sources = welcomeVideo.querySelectorAll('source');
      let failedSources = 0;
      sources.forEach((src) => {
        src.addEventListener('error', () => {
          failedSources++;
          if (failedSources >= sources.length) {
            dismissWelcome();
          }
        });
      });

      const playPromise = welcomeVideo.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          dismissWelcome();
        });
      }
    }

    // Default 18 Camera Movements Library
    const defaultMovements = [
      {
        id: 'dolly-in',
        title: 'Dolly Push-In',
        category: 'Dolly & Tracking',
        hud: 'Z-AXIS FORWARD DOLLY',
        anim: 'anim-dolly-in',
        bestFor: 'Emotional Intimacy & Product Focus',
        desc: 'Physical camera moves smoothly forward on tracks toward the subject, deepening spatial perspective.',
        prompt: 'Smooth cinematic dolly push-in moving steadily forward toward [SUBJECT], deepening foreground and background parallax, shallow depth of field, filmic motion blur.'
      },
      {
        id: 'dolly-out',
        title: 'Dolly Pull-Out',
        category: 'Dolly & Tracking',
        hud: 'Z-AXIS REVERSE REVEAL',
        anim: 'anim-dolly-out',
        bestFor: 'Environment Reveal & Isolation',
        desc: 'Camera glides backward away from a close detail to gradually reveal the surrounding space.',
        prompt: 'Controlled cinematic dolly pull-out retreating smoothly from [SUBJECT] to reveal the expansive architectural environment, balanced lighting, natural perspective.'
      },
      {
        id: 'orbit-360',
        title: '360° Orbital Arc',
        category: 'Dolly & Tracking',
        hud: '360° RADIAL ORBIT',
        anim: 'anim-orbit',
        bestFor: 'Hero Product & Character Showcase',
        desc: 'Camera circles smoothly around a locked central subject while the background sweeps dynamically.',
        prompt: 'Seamless 360-degree orbital arc shot revolving smoothly around [SUBJECT] locked in center frame, dynamic background sweep, dramatic rim lighting.'
      },
      {
        id: 'steadicam',
        title: 'Steadicam Follow Shot',
        category: 'Dolly & Tracking',
        hud: 'DYNAMIC TRACKING LEAD',
        anim: 'anim-steadicam',
        bestFor: 'Walking Dialogue & Corridor Scenes',
        desc: 'Fluid, weightless tracking behind or ahead of a moving subject with subtle organic breathing.',
        prompt: 'Fluid Steadicam tracking shot following closely behind [SUBJECT] moving through an atmospheric space, stabilized gimbal motion, natural depth.'
      },
      {
        id: 'truck-lateral',
        title: 'Lateral Truck Slide',
        category: 'Dolly & Tracking',
        hud: 'X-AXIS HORIZONTAL TRACK',
        anim: 'anim-truck',
        bestFor: 'Side-Scrolling Parallax & Reveals',
        desc: 'Entire camera rig moves sideways parallel to the scene, creating strong foreground parallax.',
        prompt: 'Smooth lateral truck camera slide moving horizontally past [SUBJECT], crisp foreground-to-background parallax layers, precision cinema track.'
      },
      {
        id: 'pedestal-up',
        title: 'Pedestal Up',
        category: 'Dolly & Tracking',
        hud: 'Y-AXIS VERTICAL ELEVATION',
        anim: 'anim-pedestal',
        bestFor: 'Heroic Stature & Tall Architecture',
        desc: 'Entire camera body rises vertically on a hydraulic column without tilting, maintaining straight verticals.',
        prompt: 'Steady vertical pedestal-up camera movement rising smoothly from floor level to reveal [SUBJECT], keeping architectural vertical lines completely straight.'
      },
      {
        id: 'pan-sweep',
        title: 'Panoramic Horizontal Pan',
        category: 'Pan & Tilt',
        hud: 'YAW AXIS ROTATION',
        anim: 'anim-pan',
        bestFor: 'Wide Landscapes & Spatial Survey',
        desc: 'Camera rotates horizontally left-to-right from a fixed tripod head to survey the scene.',
        prompt: 'Steady panoramic horizontal pan sweeping smoothly across the scene to frame [SUBJECT], crisp horizon, cinematic tripod head fluidity.'
      },
      {
        id: 'tilt-up',
        title: 'Vertical Tilt-Up Reveal',
        category: 'Pan & Tilt',
        hud: 'PITCH AXIS UPWARD',
        anim: 'anim-tilt',
        bestFor: 'Scale & Monumental Introductions',
        desc: 'Camera pivots upward on its vertical axis from the base of a subject to its peak.',
        prompt: 'Dramatic vertical tilt-up camera shot starting from the base and pivoting upward to reveal the full height of [SUBJECT], atmospheric lighting.'
      },
      {
        id: 'whip-pan',
        title: 'High-Speed Whip Pan',
        category: 'Pan & Tilt',
        hud: 'RAPID MOTION BLUR SWEEP',
        anim: 'anim-whip',
        bestFor: 'Energetic Transitions & Action Cuts',
        desc: 'Ultra-fast horizontal camera rotation creating streaking directional motion blur into a sudden stop.',
        prompt: 'High-velocity whip pan camera transition snapping rapidly with directional motion blur onto [SUBJECT], sharp sudden lock-on, kinetic energy.'
      },
      {
        id: 'dutch-angle',
        title: 'Dutch Roll Tilt',
        category: 'Pan & Tilt',
        hud: 'Z-AXIS HORIZON ROLL',
        anim: 'anim-dutch',
        bestFor: 'Psychological Tension & Stylistic Edge',
        desc: 'Camera rolls along its optical axis so the horizon tilts diagonally, creating dramatic unease.',
        prompt: 'Stylized Dutch angle shot with a tilted diagonal horizon framing [SUBJECT], subtle rolling camera tension, high-contrast cinema lighting.'
      },
      {
        id: 'crash-zoom',
        title: 'Snap Crash Zoom',
        category: 'Zoom & Lens',
        hud: 'HIGH-SPEED FOCAL PUNCH',
        anim: 'anim-crash',
        bestFor: 'Sudden Shock, Comedy & Impact',
        desc: 'Rapid optical zoom punching instantaneously from a wide view into an extreme close-up.',
        prompt: 'Explosive high-speed snap crash zoom punching rapidly from wide frame straight into an extreme close-up of [SUBJECT], crisp optical focus.'
      },
      {
        id: 'vertigo-dolly',
        title: 'Hitchcock Dolly Zoom',
        category: 'Zoom & Lens',
        hud: 'CONTRA-ZOOM WARP',
        anim: 'anim-vertigo',
        bestFor: 'Disorientation & Realization Moments',
        desc: 'Camera dollies backward while zooming in simultaneously, keeping subject size constant as background warps.',
        prompt: 'Dramatic Hitchcock vertigo dolly zoom effect on [SUBJECT], foreground subject stays locked in size while background perspective stretches and warps intensely.'
      },
      {
        id: 'rack-focus',
        title: 'Cinematic Rack Focus',
        category: 'Zoom & Lens',
        hud: 'DEPTH-OF-FIELD SHIFT',
        anim: 'anim-rack',
        bestFor: 'Directing Viewer Attention',
        desc: 'Focus pulls smoothly from a blurred foreground element onto the sharp subject (or vice versa).',
        prompt: 'Shallow depth-of-field rack focus shifting smoothly from soft creamy foreground bokeh onto razor-sharp details of [SUBJECT], anamorphic lens flare.'
      },
      {
        id: 'macro-probe',
        title: 'Laowa Macro Probe Glide',
        category: 'Zoom & Lens',
        hud: 'EXTREME CLOSE-UP OPTIC',
        anim: 'anim-macro',
        bestFor: 'Precision Hardware & Micro Textures',
        desc: 'Ultra-close tubular lens glides millimeters above metallic surfaces, revealing microscopic craftsmanship.',
        prompt: 'Extreme macro probe lens gliding millimeters across the precision surface texture of [SUBJECT], razor-thin focus plane, specular studio highlights.'
      },
      {
        id: 'fpv-dive',
        title: 'FPV Cinewhoop Dive',
        category: 'Drone & Aerial',
        hud: 'HIGH-G ACROBATIC DIVE',
        anim: 'anim-fpv',
        bestFor: 'Adrenaline Fly-Throughs & Speed',
        desc: 'Agile first-person drone dives steeply downward, banking smoothly through tight architectural gaps.',
        prompt: 'Dynamic FPV drone dive swooping downward at high speed and banking smoothly past [SUBJECT], immersive wide-angle perspective, fluid stabilization.'
      },
      {
        id: 'crane-jib',
        title: 'Sweeping Crane / Jib Rise',
        category: 'Drone & Aerial',
        hud: 'ELEVATED ARC BOOM',
        anim: 'anim-crane',
        bestFor: 'Grand Finale & Epic Scale',
        desc: 'Camera lifts high into the air on a sweeping crane arc while tilting down to keep the subject centered.',
        prompt: 'Majestic sweeping crane jib shot rising high above [SUBJECT] while tilting downward smoothly to showcase grand architectural scale.'
      },
      {
        id: 'top-down',
        title: '90° Top-Down God’s Eye',
        category: 'Drone & Aerial',
        hud: 'NADIR VERTICAL AXIS',
        anim: 'anim-topdown',
        bestFor: 'Geometric Symmetry & Flat-Lays',
        desc: 'Camera points straight down perpendicular to the ground, slowly rotating or ascending.',
        prompt: '90-degree top-down bird’s-eye overhead shot looking straight down at [SUBJECT], symmetrical geometric composition, slow rotation.'
      },
      {
        id: 'handheld',
        title: 'Handheld Documentary Shake',
        category: 'Dynamic / Action',
        hud: 'ORGANIC SHOULDER RIG',
        anim: 'anim-handheld',
        bestFor: 'Raw Realism & Urgent Immersion',
        desc: 'Subtle, natural micro-jitters from an operator’s shoulder rig for authentic visceral presence.',
        prompt: 'Authentic handheld cinema camera movement with subtle organic shoulder-rig micro-motion capturing [SUBJECT], raw documentary realism, natural lighting.'
      }
    ];

    let movements = JSON.parse(localStorage.getItem('taiton_camera_movements')) || defaultMovements;
    let activeCategory = 'All';
    let searchQuery = '';
    let activeModalMovement = null;

    const categories = ['All', 'Dolly & Tracking', 'Pan & Tilt', 'Zoom & Lens', 'Drone & Aerial', 'Dynamic / Action'];

    function renderCategories() {
      const container = document.getElementById('categoryPills');
      container.innerHTML = categories.map(cat => {
        const count = cat === 'All'
          ? movements.length
          : movements.filter(m => m.category === cat).length;
        return `
          <button class="pill ${activeCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">
            <span>${cat}</span>
            <span class="count">${count}</span>
          </button>
        `;
      }).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const filtered = movements.filter(m => {
        const matchesCat = activeCategory === 'All' || m.category === activeCategory;
        const q = searchQuery.toLowerCase();
        const matchesSearch = !q ||
          m.title.toLowerCase().includes(q) ||
          m.desc.toLowerCase().includes(q) ||
          m.prompt.toLowerCase().includes(q) ||
          m.bestFor.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      grid.innerHTML = filtered.map(m => `
        <article class="card">
          <div class="viewport ${m.anim}" onclick="openCustomizer('${m.id}')">
            <div class="grid-floor"></div>
            <div class="scene-stage">
              <div class="pillar left"></div>
              <div class="subject-prism"></div>
              <div class="pillar right"></div>
            </div>
            <div class="hud-corner hud-tl"></div>
            <div class="hud-corner hud-tr"></div>
            <div class="hud-corner hud-br"></div>
            <span class="hud-tag">${m.hud}</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">${m.title}</h3>
            <div class="best-for">&#9673; Best for: ${m.bestFor}</div>
            <p class="card-desc">${m.desc}</p>
            <div class="prompt-box">
              <div class="prompt-header">
                <span class="prompt-label">AI Video Prompt</span>
                <button class="edit-params-btn" onclick="openCustomizer('${m.id}')">Edit Params &rarr;</button>
              </div>
              <div class="prompt-text">${m.prompt}</div>
            </div>
            <button class="copy-btn" onclick="copyCardPrompt(this, '${m.id}')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Copy Prompt</span>
            </button>
          </div>
        </article>
      `).join('');
    }

    function copyCardPrompt(btn, id) {
      const m = movements.find(item => item.id === id);
      if (!m) return;
      navigator.clipboard.writeText(m.prompt);
      const span = btn.querySelector('span');
      const original = span.textContent;
      btn.classList.add('copied');
      span.textContent = 'Copied to Clipboard!';
      setTimeout(() => {
        btn.classList.remove('copied');
        span.textContent = original;
      }, 1600);
    }

    function openCustomizer(id) {
      activeModalMovement = movements.find(m => m.id === id);
      if (!activeModalMovement) return;
      document.getElementById('modalMovementTitle').textContent = `${activeModalMovement.title} — Prompt Builder`;
      updateLivePrompt();
      document.getElementById('customizerModal').classList.add('open');
    }

    function updateLivePrompt() {
      if (!activeModalMovement) return;
      const subject = document.getElementById('paramSubject').value.trim() || '[SUBJECT]';
      const lens = document.getElementById('paramLens').value;
      const speed = document.getElementById('paramSpeed').value;
      const aspect = document.getElementById('paramAspect').value;
      const quality = document.getElementById('paramQuality').value;

      const base = activeModalMovement.prompt.replace(/\[SUBJECT\]/g, subject);
      const fullPrompt = `${base} Shot on ${lens}, ${speed} camera movement, ${quality} ${aspect}`;
      document.getElementById('livePromptPreview').textContent = fullPrompt;
    }

    ['paramSubject', 'paramLens', 'paramSpeed', 'paramAspect', 'paramQuality'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateLivePrompt);
      document.getElementById(id).addEventListener('change', updateLivePrompt);
    });

    document.getElementById('modalCopyBtn').addEventListener('click', function () {
      const text = document.getElementById('livePromptPreview').textContent;
      navigator.clipboard.writeText(text);
      this.textContent = 'Copied Customized Prompt!';
      setTimeout(() => {
        this.textContent = 'Copy Customized Prompt';
      }, 1600);
    });

    document.getElementById('openCreateModalBtn').addEventListener('click', () => {
      document.getElementById('createModal').classList.add('open');
    });

    document.getElementById('createMovementForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newPreset = {
        id: 'custom-' + Date.now(),
        title: document.getElementById('newTitle').value.trim(),
        category: document.getElementById('newCategory').value,
        hud: 'CUSTOM MOTION PRESET',
        anim: document.getElementById('newAnim').value,
        bestFor: document.getElementById('newBestFor').value.trim(),
        desc: document.getElementById('newDesc').value.trim(),
        prompt: document.getElementById('newPrompt').value.trim()
      };
      movements.unshift(newPreset);
      localStorage.setItem('taiton_camera_movements', JSON.stringify(movements));
      e.target.reset();
      closeModal('createModal');
      renderCategories();
      renderCards();
    });

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    renderCategories();
    renderCards();
  </script>
</body>
</html>
