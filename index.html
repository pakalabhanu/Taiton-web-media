<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taiton web@Media</title>
  <style>
    :root {
      --bg-primary: #090b10;
      --bg-secondary: #111520;
      --bg-card: #151a27;
      --bg-card-hover: #1b2233;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --danger: #ef4444;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Full-Screen Blended Welcome Intro (Plays ONLY on page load/refresh, zero text/buttons) */
    #welcomeOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      mix-blend-mode: screen;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #welcomeOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #welcomeVideo {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 720px;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: contrast(1.35) brightness(1.08);
      -webkit-mask-image: radial-gradient(ellipse 78% 78% at 50% 50%, #000 55%, transparent 96%);
      mask-image: radial-gradient(ellipse 78% 78% at 50% 50%, #000 55%, transparent 96%);
      pointer-events: none;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 16, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 32px;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand h1 span {
      color: #818cf8;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 640px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 300px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-admin {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-admin:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-admin.active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .admin-only {
      display: none !important;
    }

    body.is-admin .admin-only {
      display: inline-flex !important;
    }

    body.is-admin .admin-only-block {
      display: block !important;
    }

    /* Navigation Hierarchy: All -> Categories -> Sub-Categories */
    .nav-hierarchy {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 32px 6px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .pill:hover {
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .pill.sub-pill {
      padding: 6px 14px;
      font-size: 0.8rem;
      background: rgba(99, 102, 241, 0.08);
      border-color: rgba(99, 102, 241, 0.25);
      color: #c7d2fe;
    }

    .pill.sub-pill.active {
      background: #4f46e5;
      color: #fff;
      border-color: #818cf8;
    }

    .pill .count {
      font-size: 0.72rem;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
    }

    .category-drawer {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      animation: fadeSlide 0.22s ease;
    }

    .category-drawer.open {
      display: flex;
    }

    .subcategory-drawer {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: rgba(17, 21, 32, 0.75);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      animation: fadeSlide 0.22s ease;
    }

    .subcategory-drawer.open {
      display: flex;
    }

    .drawer-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-right: 4px;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards Grid */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 32px 60px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--border-accent);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      background: var(--bg-card-hover);
    }

    /* Media Video Screen Area (Top Circle in Reference 1) */
    .media-screen-wrap {
      position: relative;
      background: #07090e;
      border-bottom: 1px solid var(--border-subtle);
    }

    .media-screen {
      position: relative;
      height: 220px;
      width: 100%;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #182038 0%, #090b10 100%);
    }

    .media-screen video,
    .media-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .media-screen:hover video,
    .media-screen:hover img {
      transform: scale(1.03);
    }

    .expand-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(9, 11, 16, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .media-screen:hover .expand-badge {
      opacity: 1;
    }

    .cat-tag-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(9, 11, 16, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #a5b4fc;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* Admin-only Edit Bar directly below video screen */
    .admin-media-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(99, 102, 241, 0.1);
      border-top: 1px solid rgba(99, 102, 241, 0.25);
    }

    body.is-admin .admin-media-bar {
      display: flex;
    }

    .admin-edit-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .admin-edit-btn:hover {
      background: var(--accent-hover);
    }

    .admin-delete-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }

    .admin-delete-btn:hover {
      background: var(--danger);
      color: #fff;
    }

    /* Thumbnail Text Area (Bottom Circle in Reference 1) */
    .card-body {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .thumbnail-text-box {
      background: rgba(9, 11, 16, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      min-height: 76px;
      color: var(--text-primary);
      font-size: 0.94rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .thumbnail-text-box strong,
    .thumbnail-text-box b {
      color: #fff;
      font-weight: 800;
    }

    /* Rich Text Toolbar inside Admin Edit Modal */
    .rich-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-bottom: none;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tool-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .rich-editor {
      min-height: 96px;
      padding: 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.92rem;
      outline: none;
      line-height: 1.5;
    }

    .rich-editor:focus {
      border-color: var(--accent);
    }

    /* Modals & Video Lightbox */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 600;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 560px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      max-height: 90vh;
      overflow-y: auto;
    }

    .lightbox-modal {
      background: #07090e;
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 960px;
      overflow: hidden;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.85);
    }

    .lightbox-media-wrap {
      width: 100%;
      max-height: 72vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-media-wrap video,
    .lightbox-media-wrap img {
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
    }

    .lightbox-footer {
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-subtle);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 1.12rem;
      font-weight: 700;
    }

    .close-modal {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .close-modal:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.16);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group select {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text-primary);
      font-size: 0.86rem;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--accent);
    }

    .file-drop-zone {
      border: 1.5px dashed var(--border-accent);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      background: rgba(99, 102, 241, 0.05);
      cursor: pointer;
      font-size: 0.84rem;
      color: #c7d2fe;
    }

    .file-drop-zone:hover {
      background: rgba(99, 102, 241, 0.12);
    }

    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (max-width: 640px) {
      header, .nav-hierarchy, main { padding-left: 16px; padding-right: 16px; }
      .cards-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Blended Welcome Intro (Plays ONLY on page load / refresh, zero text/buttons) -->
  <div id="welcomeOverlay" onclick="dismissWelcome()">
    <video id="welcomeVideo" autoplay muted playsinline>
      <source src="Welcom-Note.mp4" type="video/mp4" />
      <source src="welcome.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Clean Header (Strike-out text removed) -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </div>
        <h1>Taiton <span>web@Media</span></h1>
      </div>

      <div class="header-controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search thumbnails & categories..." />
        </div>
        <button class="btn-primary admin-only" onclick="openAddCardModal()">+ Add Media Card</button>
        <button class="btn-admin" id="adminToggleBtn" onclick="toggleAdminMode()">Admin Login</button>
      </div>
    </div>
  </header>

  <!-- Hierarchy Filter Bar: Click 'All' -> Shows Categories -> Click Category -> Shows Sub-Categories -->
  <section class="nav-hierarchy">
    <div class="nav-row">
      <button class="pill active" id="allMasterBtn" onclick="handleAllClick()">
        <span>All</span>
        <span class="count" id="allTotalCount">0</span>
      </button>

      <!-- Categories Drawer (Revealed when 'All' is clicked) -->
      <div class="category-drawer" id="categoryDrawer"></div>
    </div>

    <!-- Sub-Categories Drawer (Revealed when a Category is clicked) -->
    <div class="subcategory-drawer" id="subCategoryDrawer"></div>
  </section>

  <!-- Loop Video Preview Cards Grid -->
  <main>
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <footer>
    &copy; 2026 Taiton web@Media
  </footer>

  <!-- Popup Lightbox Window for Video/Image Playback -->
  <div class="modal-backdrop" id="lightboxBackdrop" onclick="closeLightbox(event)">
    <div class="lightbox-modal" onclick="event.stopPropagation()">
      <div class="lightbox-media-wrap" id="lightboxMediaContainer"></div>
      <div class="lightbox-footer">
        <div class="thumbnail-text-box" style="border:none; background:transparent; padding:0; min-height:auto;" id="lightboxCaption"></div>
        <button class="close-modal" onclick="forceCloseLightbox()">&times;</button>
      </div>
    </div>
  </div>

  <!-- Admin Edit / Add Media & Rich Thumbnail Text Modal -->
  <div class="modal-backdrop" id="mediaEditorModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="editorModalHeading">Edit Media &amp; Thumbnail Text</h2>
        <button class="close-modal" onclick="closeEditorModal()">&times;</button>
      </div>
      <form id="mediaEditorForm">
        <input type="hidden" id="editCardId" />
        <div class="form-grid">
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="editCategory" list="categorySuggestions" required placeholder="e.g., Camera Movements" />
            <datalist id="categorySuggestions"></datalist>
          </div>
          <div class="form-group">
            <label>Sub-Category</label>
            <input type="text" id="editSubCategory" list="subCategorySuggestions" required placeholder="e.g., Dolly Push-In" />
            <datalist id="subCategorySuggestions"></datalist>
          </div>

          <div class="form-group full">
            <label>Upload Media File (MP4 / WebM Video or JPG / PNG Image)</label>
            <label class="file-drop-zone" for="editMediaFile">
              <span id="fileLabelText">Click to select Video (.mp4) or Image (.jpg/.png) from computer</span>
              <input type="file" id="editMediaFile" accept="video/*,image/*" style="display:none;" />
            </label>
          </div>

          <div class="form-group full">
            <label>Or Paste Direct Media File Path / URL (Optional)</label>
            <input type="text" id="editMediaUrl" placeholder="e.g., videos/dolly-push.mp4 or https://..." />
          </div>

          <div class="form-group full">
            <label>Thumbnail Text (Supports Bold, Special Characters &amp; Symbols)</label>
            <div class="rich-toolbar">
              <button type="button" class="tool-btn" onclick="execRichCmd('bold')"><b>B</b> Bold</button>
              <button type="button" class="tool-btn" onclick="execRichCmd('italic')"><i>I</i> Italic</button>
              <button type="button" class="tool-btn" onclick="insertSymbol('★')">★</button>
              <button type="button" class="tool-btn" onclick="insertSymbol('⚡')">⚡</button>
              <button type="button" class="tool-btn" onclick="insertSymbol('•')">•</button>
              <button type="button" class="tool-btn" onclick="insertSymbol('→')">→</button>
              <button type="button" class="tool-btn" onclick="insertSymbol('°')">°</button>
              <button type="button" class="tool-btn" onclick="insertSymbol('®')">®</button>
              <button type="button" class="tool-btn" onclick="insertSymbol('™')">™</button>
            </div>
            <div class="rich-editor" id="editThumbnailRichText" contenteditable="true"></div>
          </div>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Save Media &amp; Thumbnail Text</button>
      </form>
    </div>
  </div>

  <script>
    // 1. Welcome Video Overlay (Plays strictly on page load/refresh, click dismisses immediately)
    const welcomeOverlay = document.getElementById('welcomeOverlay');
    const welcomeVideo = document.getElementById('welcomeVideo');

    function dismissWelcome() {
      if (!welcomeOverlay || welcomeOverlay.classList.contains('hidden')) return;
      welcomeOverlay.classList.add('hidden');
      if (welcomeVideo) welcomeVideo.pause();
    }

    if (welcomeVideo) {
      welcomeVideo.addEventListener('ended', dismissWelcome);
      const sources = welcomeVideo.querySelectorAll('source');
      let failed = 0;
      sources.forEach(s => s.addEventListener('error', () => {
        failed++;
        if (failed >= sources.length) dismissWelcome();
      }));
      const p = welcomeVideo.play();
      if (p !== undefined) p.catch(() => dismissWelcome());
    }

    // 2. Admin Mode State (Default PIN: 1234)
    const ADMIN_PIN = '1234';
    let isAdmin = sessionStorage.getItem('taiton_admin') === 'true';

    function applyAdminUI() {
      const btn = document.getElementById('adminToggleBtn');
      if (isAdmin) {
        document.body.classList.add('is-admin');
        btn.classList.add('active');
        btn.textContent = 'Admin Active (Logout)';
      } else {
        document.body.classList.remove('is-admin');
        btn.classList.remove('active');
        btn.textContent = 'Admin Login';
      }
    }

    function toggleAdminMode() {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem('taiton_admin');
        applyAdminUI();
        return;
      }
      const entered = prompt('Enter Admin PIN to edit media & thumbnails:');
      if (entered === ADMIN_PIN) {
        isAdmin = true;
        sessionStorage.setItem('taiton_admin', 'true');
        applyAdminUI();
      } else if (entered !== null) {
        alert('Incorrect PIN.');
      }
    }

    // 3. Initial Media Items with Categories & Sub-Categories
    const defaultMediaItems = [
      {
        id: 'item-1',
        category: 'Camera Movements',
        subCategory: 'Dolly Push-In',
        mediaType: 'video',
        mediaUrl: 'Welcom-Note.mp4',
        thumbnailHtml: '<b>Dolly Push-In</b> • Z-Axis Forward Motion ★ Smooth 8K Cinema Reveal'
      },
      {
        id: 'item-2',
        category: 'Camera Movements',
        subCategory: '360° Orbital Arc',
        mediaType: 'video',
        mediaUrl: 'Welcom-Note.mp4',
        thumbnailHtml: '<b>360° Orbital Arc</b> → Hero Product Showcase • Seamless Studio Rotation'
      },
      {
        id: 'item-3',
        category: 'Architectural Hardware',
        subCategory: 'Concealed Hinges',
        mediaType: 'video',
        mediaUrl: 'Welcom-Note.mp4',
        thumbnailHtml: '<b>TAITON® Concealed Hinges</b> ⚡ Precision 3D Mechanical Assembly'
      },
      {
        id: 'item-4',
        category: 'Architectural Hardware',
        subCategory: 'Smart Door Locks',
        mediaType: 'video',
        mediaUrl: 'Welcom-Note.mp4',
        thumbnailHtml: '<b>TRILLIONS™ Smart Lock</b> • Matte Black & Rose Gold Finish Showcase'
      },
      {
        id: 'item-5',
        category: 'Aerial & Drone',
        subCategory: 'FPV Dive',
        mediaType: 'video',
        mediaUrl: 'Welcom-Note.mp4',
        thumbnailHtml: '<b>FPV Cinewhoop Dive</b> ★ High-Speed Architectural Fly-Through'
      },
      {
        id: 'item-6',
        category: 'Lens & Optics',
        subCategory: 'Macro Probe',
        mediaType: 'video',
        mediaUrl: 'Welcom-Note.mp4',
        thumbnailHtml: '<b>100mm Macro Probe Glide</b> • Satin-Brushed Aluminum Micro Texture'
      }
    ];

    let mediaItems = JSON.parse(localStorage.getItem('taiton_media_items_v2')) || defaultMediaItems;
    let categoriesOpen = false;
    let selectedCategory = null;
    let selectedSubCategory = null;
    let searchQuery = '';
    let pendingUploadedDataUrl = null;
    let pendingUploadedType = null;

    function saveItems() {
      try {
        localStorage.setItem('taiton_media_items_v2', JSON.stringify(mediaItems));
      } catch (e) {
        alert('Browser storage limit reached for large local video files. For heavy videos, paste a relative file path (e.g., videos/clip.mp4) or connect cloud database tomorrow.');
      }
    }

    // 4. Hierarchy Navigation: Click 'All' -> Categories -> Sub-Categories
    function handleAllClick() {
      categoriesOpen = !categoriesOpen;
      if (!categoriesOpen) {
        selectedCategory = null;
        selectedSubCategory = null;
      }
      renderHierarchy();
      renderCards();
    }

    function selectCategory(cat) {
      if (selectedCategory === cat) {
        selectedCategory = null;
        selectedSubCategory = null;
      } else {
        selectedCategory = cat;
        selectedSubCategory = null;
      }
      renderHierarchy();
      renderCards();
    }

    function selectSubCategory(sub) {
      selectedSubCategory = (selectedSubCategory === sub) ? null : sub;
      renderHierarchy();
      renderCards();
    }

    function renderHierarchy() {
      document.getElementById('allTotalCount').textContent = mediaItems.length;
      const allBtn = document.getElementById('allMasterBtn');
      const catDrawer = document.getElementById('categoryDrawer');
      const subDrawer = document.getElementById('subCategoryDrawer');

      if (!selectedCategory && !selectedSubCategory) {
        allBtn.classList.add('active');
      } else {
        allBtn.classList.remove('active');
      }

      if (categoriesOpen) {
        catDrawer.classList.add('open');
        const uniqueCats = [...new Set(mediaItems.map(i => i.category))];
        catDrawer.innerHTML = uniqueCats.map(cat => {
          const count = mediaItems.filter(i => i.category === cat).length;
          const isActive = selectedCategory === cat ? 'active' : '';
          return `
            <button class="pill ${isActive}" onclick="selectCategory('${escapeQuotes(cat)}')">
              <span>${cat}</span>
              <span class="count">${count}</span>
            </button>
          `;
        }).join('');
      } else {
        catDrawer.classList.remove('open');
        catDrawer.innerHTML = '';
      }

      if (categoriesOpen && selectedCategory) {
        const subCats = [...new Set(
          mediaItems.filter(i => i.category === selectedCategory).map(i => i.subCategory)
        )];
        subDrawer.classList.add('open');
        subDrawer.innerHTML = `<span class="drawer-label">${selectedCategory} &rsaquo;</span>` + subCats.map(sub => {
          const count = mediaItems.filter(i => i.category === selectedCategory && i.subCategory === sub).length;
          const isActive = selectedSubCategory === sub ? 'active' : '';
          return `
            <button class="pill sub-pill ${isActive}" onclick="selectSubCategory('${escapeQuotes(sub)}')">
              <span>${sub}</span>
              <span class="count">${count}</span>
            </button>
          `;
        }).join('');
      } else {
        subDrawer.classList.remove('open');
        subDrawer.innerHTML = '';
      }
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'");
    }

    // 5. Render Cards Grid
    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const q = searchQuery.toLowerCase();

      const filtered = mediaItems.filter(item => {
        const matchCat = !selectedCategory || item.category === selectedCategory;
        const matchSub = !selectedSubCategory || item.subCategory === selectedSubCategory;
        const plainText = item.thumbnailHtml.replace(/<[^>]*>/g, '').toLowerCase();
        const matchSearch = !q ||
          plainText.includes(q) ||
          item.category.toLowerCase().includes(q) ||
          item.subCategory.toLowerCase().includes(q);
        return matchCat && matchSub && matchSearch;
      });

      grid.innerHTML = filtered.map(item => {
        const mediaEl = item.mediaType === 'image'
          ? `<img src="${item.mediaUrl}" alt="Thumbnail Media" />`
          : `<video src="${item.mediaUrl}" autoplay loop muted playsinline></video>`;

        return `
          <article class="card">
            <div class="media-screen-wrap">
              <div class="media-screen" onclick="openLightbox('${item.id}')">
                ${mediaEl}
                <span class="cat-tag-overlay">${item.category} &bull; ${item.subCategory}</span>
                <span class="expand-badge">&#9974; Click to Expand</span>
              </div>
              <div class="admin-media-bar">
                <button class="admin-edit-btn" onclick="openEditCardModal('${item.id}')">&#9998; Edit Media &amp; Text</button>
                <button class="admin-delete-btn" onclick="deleteCard('${item.id}')">Delete</button>
              </div>
            </div>
            <div class="card-body">
              <div class="thumbnail-text-box">${item.thumbnailHtml}</div>
            </div>
          </article>
        `;
      }).join('');
    }

    // 6. Popup Lightbox Window
    function openLightbox(id) {
      const item = mediaItems.find(i => i.id === id);
      if (!item) return;
      const container = document.getElementById('lightboxMediaContainer');
      const caption = document.getElementById('lightboxCaption');

      if (item.mediaType === 'image') {
        container.innerHTML = `<img src="${item.mediaUrl}" alt="Preview" />`;
      } else {
        container.innerHTML = `<video src="${item.mediaUrl}" controls autoplay loop playsinline></video>`;
      }
      caption.innerHTML = item.thumbnailHtml;
      document.getElementById('lightboxBackdrop').classList.add('open');
    }

    function closeLightbox(e) {
      if (e.target.id === 'lightboxBackdrop') forceCloseLightbox();
    }

    function forceCloseLightbox() {
      document.getElementById('lightboxBackdrop').classList.remove('open');
      document.getElementById('lightboxMediaContainer').innerHTML = '';
    }

    // 7. Admin Edit / Add Modal Logic
    function populateDataLists() {
      const cats = [...new Set(mediaItems.map(i => i.category))];
      const subs = [...new Set(mediaItems.map(i => i.subCategory))];
      document.getElementById('categorySuggestions').innerHTML = cats.map(c => `<option value="${c}">`).join('');
      document.getElementById('subCategorySuggestions').innerHTML = subs.map(s => `<option value="${s}">`).join('');
    }

    function openEditCardModal(id) {
      if (!isAdmin) return;
      const item = mediaItems.find(i => i.id === id);
      if (!item) return;
      populateDataLists();
      pendingUploadedDataUrl = null;
      pendingUploadedType = null;

      document.getElementById('editorModalHeading').textContent = 'Edit Media & Thumbnail Text';
      document.getElementById('editCardId').value = item.id;
      document.getElementById('editCategory').value = item.category;
      document.getElementById('editSubCategory').value = item.subCategory;
      document.getElementById('editMediaUrl').value = item.mediaUrl.startsWith('data:') ? '' : item.mediaUrl;
      document.getElementById('fileLabelText').textContent = 'Click to upload new Video (.mp4) or Image (.jpg/.png)';
      document.getElementById('editThumbnailRichText').innerHTML = item.thumbnailHtml;
      document.getElementById('mediaEditorModal').classList.add('open');
    }

    function openAddCardModal() {
      if (!isAdmin) return;
      populateDataLists();
      pendingUploadedDataUrl = null;
      pendingUploadedType = null;

      document.getElementById('editorModalHeading').textContent = 'Add New Media Card';
      document.getElementById('editCardId').value = '';
      document.getElementById('editCategory').value = selectedCategory || 'Camera Movements';
      document.getElementById('editSubCategory').value = selectedSubCategory || '';
      document.getElementById('editMediaUrl').value = 'Welcom-Note.mp4';
      document.getElementById('fileLabelText').textContent = 'Click to upload Video (.mp4) or Image (.jpg/.png)';
      document.getElementById('editThumbnailRichText').innerHTML = '<b>New Showcase Title</b> • Custom Description ★';
      document.getElementById('mediaEditorModal').classList.add('open');
    }

    function closeEditorModal() {
      document.getElementById('mediaEditorModal').classList.remove('open');
    }

    document.getElementById('editMediaFile').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('fileLabelText').textContent = `Selected: ${file.name}`;
      pendingUploadedType = file.type.startsWith('image/') ? 'image' : 'video';

      const reader = new FileReader();
      reader.onload = function (ev) {
        pendingUploadedDataUrl = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function execRichCmd(cmd) {
      document.execCommand(cmd, false, null);
      document.getElementById('editThumbnailRichText').focus();
    }

    function insertSymbol(sym) {
      const editor = document.getElementById('editThumbnailRichText');
      editor.focus();
      document.execCommand('insertText', false, sym);
    }

    document.getElementById('mediaEditorForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!isAdmin) return;

      const id = document.getElementById('editCardId').value;
      const category = document.getElementById('editCategory').value.trim();
      const subCategory = document.getElementById('editSubCategory').value.trim();
      const manualUrl = document.getElementById('editMediaUrl').value.trim();
      const thumbnailHtml = document.getElementById('editThumbnailRichText').innerHTML.trim();

      if (id) {
        const idx = mediaItems.findIndex(i => i.id === id);
        if (idx !== -1) {
          mediaItems[idx].category = category;
          mediaItems[idx].subCategory = subCategory;
          mediaItems[idx].thumbnailHtml = thumbnailHtml;
          if (pendingUploadedDataUrl) {
            mediaItems[idx].mediaUrl = pendingUploadedDataUrl;
            mediaItems[idx].mediaType = pendingUploadedType;
          } else if (manualUrl) {
            mediaItems[idx].mediaUrl = manualUrl;
            mediaItems[idx].mediaType = /\.(jpg|jpeg|png|webp|gif)$/i.test(manualUrl) ? 'image' : 'video';
          }
        }
      } else {
        const finalUrl = pendingUploadedDataUrl || manualUrl || 'Welcom-Note.mp4';
        const finalType = pendingUploadedType || (/\.(jpg|jpeg|png|webp|gif)$/i.test(finalUrl) ? 'image' : 'video');
        mediaItems.unshift({
          id: 'item-' + Date.now(),
          category,
          subCategory,
          mediaType: finalType,
          mediaUrl: finalUrl,
          thumbnailHtml
        });
      }

      saveItems();
      closeEditorModal();
      renderHierarchy();
      renderCards();
    });

    function deleteCard(id) {
      if (!isAdmin) return;
      if (!confirm('Delete this media card?')) return;
      mediaItems = mediaItems.filter(i => i.id !== id);
      saveItems();
      renderHierarchy();
      renderCards();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    // Initialize
    applyAdminUI();
    renderHierarchy();
    renderCards();
  </script>
</body>
</html>
